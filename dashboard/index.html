<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord 106</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</svg>

<main class="dash">

  <!-- gauge pod -->
  <section class="pod" aria-label="Compteurs">
    <div class="hood"></div>
    <div class="gauges">
      <svg class="gauge" viewBox="0 0 100 100" data-gauge="0" role="img" aria-label="Compteur 1">
        <circle class="g-face" cx="50" cy="50" r="46"/>
        <g class="g-ticks"></g>
        <path class="g-arc" d="M 17.5 82.5 A 46 46 0 1 1 82.5 82.5"/>
        <line class="g-needle" x1="50" y1="50" x2="50" y2="12"/>
        <circle class="g-hub" cx="50" cy="50" r="4"/>
      </svg>
      <svg class="gauge" viewBox="0 0 100 100" data-gauge="1" role="img" aria-label="Compteur 2">
        <circle class="g-face" cx="50" cy="50" r="46"/>
        <g class="g-ticks"></g>
        <path class="g-arc" d="M 17.5 82.5 A 46 46 0 1 1 82.5 82.5"/>
        <line class="g-needle" x1="50" y1="50" x2="50" y2="12"/>
        <circle class="g-hub" cx="50" cy="50" r="4"/>
      </svg>
    </div>
    <!-- lion badge -->
    <div class="badge" aria-label="Lion">
      <svg viewBox="0 0 40 48" aria-hidden="true">
        <path d="M14 46 L14 30 L10 24 L12 14 L8 10 L12 6 L16 8 L20 4 L24 10 L30 12 L32 20 L28 26 L30 34 L26 46 L22 46 L24 36 L20 32 L18 36 L18 46 Z"/>
      </svg>
    </div>
  </section>

  <!-- center stack -->
  <section class="stack" aria-label="Console centrale">

    <div class="panel radio">
      <div class="knob" id="vol" tabindex="0" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        <span class="knob-mark"></span>
      </div>
      <div class="lcd" aria-live="polite">
        <span class="lcd-text" id="lcd">FM 98.7</span>
        <span class="lcd-small">ST</span>
      </div>
      <div class="presets">
        <button class="preset" data-freq="87.8">1</button>
        <button class="preset" data-freq="91.3">2</button>
        <button class="preset" data-freq="95.2">3</button>
        <button class="preset" data-freq="98.7">4</button>
        <button class="preset" data-freq="102.3">5</button>
        <button class="preset" data-freq="105.5">6</button>
      </div>
    </div>

    <div class="panel slot" aria-hidden="true"></div>

    <div class="panel climate">
      <div class="dial">
        <svg class="dial-scale" viewBox="0 0 100 100" aria-hidden="true"><g class="d-ticks"></g></svg>
        <div class="knob small" id="temp" tabindex="0" role="slider" aria-label="Temperature" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
          <span class="knob-mark"></span>
        </div>
      </div>
      <div class="sliders">
        <label class="track"><span class="sr">Ventilation</span><input type="range" min="0" max="4" step="1" value="2"></label>
        <label class="track"><span class="sr">Repartition</span><input type="range" min="0" max="4" step="1" value="1"></label>
      </div>
      <div class="window" id="win">AUTO</div>
    </div>

    <div class="panel row">
      <button class="round hatch" id="defrost" aria-pressed="false" aria-label="Degivrage"></button>
      <button class="round" aria-label="Bouton 2"></button>
      <button class="round" aria-label="Bouton 3"></button>
      <button class="round" aria-label="Bouton 4"></button>
      <span class="lamp" id="lamp" aria-hidden="true"></span>
    </div>

  </section>
</main>

<script src="dashboard.js"></script>
</body>
</html>
